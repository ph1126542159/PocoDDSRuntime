name: CI

on:
  push:
  pull_request:

jobs:
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -DPDR_ENABLE_FASTDDS=OFF -DPDR_ENABLE_OPENTELEMETRY=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find include src apps tests framework demos -type f \( -name '*.h' -o -name '*.cpp' \) -print0 |
            xargs -0 clang-format --dry-run --Werror

  linux-full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true
      - uses: actions/cache@v4
        id: native-dependencies
        with:
          path: build-deps/install
          key: native-dependencies-${{ runner.os }}-${{ hashFiles('cmake/bootstrap-dependencies.cmake') }}
      - name: Bootstrap native dependencies
        if: steps.native-dependencies.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake -B build-deps -DPDR_SOURCE_DIR=${{ github.workspace }} -DPDR_BINARY_DIR=${{ github.workspace }}/build-deps
          cmake --build build-deps --config Release --parallel 2
      - name: Configure full stack
        run: >-
          cmake -S . -B build-full -DCMAKE_BUILD_TYPE=Release
          -DPDR_INSTALL_PREFIX=${{ github.workspace }}/build-deps/install
          -DPDR_ENABLE_FASTDDS=ON -DPDR_ENABLE_OPENTELEMETRY=ON
          -DPDR_ENABLE_OTLP_HTTP=ON -DPDR_ENABLE_ADMIN=ON
          -DPDR_BUILD_QT_OPENGL_DEMO=ON
      - name: Build full stack
        run: cmake --build build-full --config Release --parallel 2
      - name: Run full acceptance suite
        run: ctest --test-dir build-full -C Release --output-on-failure
      - name: Install reusable SDK
        run: cmake --install build-full --prefix ${{ github.workspace }}/build-sdk
      - name: Build outside-tree SDK consumer
        run: >-
          cmake -S tests/install-consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build-sdk;${{ github.workspace }}/build-deps/install"
      - name: Link outside-tree SDK consumer
        run: cmake --build build-consumer --config Release --parallel 2
      - name: Run outside-tree SDK consumer
        run: ./build-consumer/pdr-install-consumer
