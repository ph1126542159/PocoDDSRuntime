# Delay before restarting pdr-runtime after an unexpected exit.
relaunchDelay = 1000

# Sliding-window restart budget. Set maxRestarts to 0 to disable relaunch.
restartBudget.maxRestarts = 5
restartBudget.windowMilliseconds = 60000

# Arguments appended to the supervised command without shell interpretation.
childArgument.count = 0
# Empty preserves inherited working-directory behavior. Set this explicitly
# when the supervised process resolves configuration or DLLs relative to cwd.
childWorkingDirectory =

# Optional deterministic environment overrides shared by preflight commands and
# the supervised child. Names must be unique (case-insensitive on Windows).
childEnvironment.count = 0
# childEnvironment.0.name = PDR_FASTDDS_PROFILE
# childEnvironment.0.value = C:/PocoDDSRuntime/config/fastdds-deployment.properties
# childEnvironment.1.name = PDR_FASTDDS_PROFILE_SHA256
# childEnvironment.1.value = <64 lowercase hexadecimal characters>

# Optional fail-closed validators run before every child start. Commands are
# launched directly without a shell. executable and workingDirectory, when set,
# must be absolute. A failed or timed-out initial preflight prevents launch.
preflight.count = 0
# preflight.0.name = fastdds-profile
# preflight.0.executable = C:/PocoDDSRuntime/bin/pdr-fastdds-profile-check.exe
# preflight.0.argument.count = 0
# preflight.0.workingDirectory = C:/PocoDDSRuntime/bin
# preflight.0.timeoutMilliseconds = 10000

# Process-tree resource boundary. Zero means unlimited for numeric limits.
resourceLimits.killProcessTreeOnExit = true
resourceLimits.memoryBytes = 0
resourceLimits.activeProcessLimit = 0
resourceLimits.cpuRatePercent = 0
# Linux cgroup v2 directory created/delegated by systemd or the deployment layer.
resourceLimits.linuxCgroupPath =

# Optional heartbeat file monitoring. Leave empty to disable.
watchdog.file =
watchdog.timeout = 600000
watchdog.interval = 60000
watchdog.startupGraceMilliseconds = 600000
watchdog.requireFile = false

# Optional cross-process native Bundle activation. The child Runtime owns Bundle
# validation; the Launcher owns the stop/start boundary, readiness probation and
# last-known-good rollback. repository and stateDirectory must point at the child.
deployment.enabled = false
deployment.repository = ${application.dir}../runtime/bundles/
deployment.stateDirectory = ${application.dir}../runtime/data/bundle-manager/
deployment.pollMilliseconds = 250
deployment.stopTimeoutMilliseconds = 30000
deployment.startupTimeoutMilliseconds = 120000
deployment.probationMilliseconds = 10000
# Empty means BundleManager's exact transaction acknowledgement is the gate.
deployment.readiness.file =
deployment.readiness.requireTransactionId = false
# Must mirror the supervised Runtime's osp.bundleMonitor.authorization.* values.
# Policy, public keys and digest-bound evidence must come from the trusted host,
# not from deployment.repository. When required, schema v2 rolloutSequence and
# release-manifest/SBOM provenance are checked against durable high-water state.
deployment.authorization.required = false
deployment.authorization.repositoryId =
deployment.authorization.evidenceDirectory =
deployment.authorization.trustPolicyFile =
deployment.authorization.expectedTrustPolicyId =
deployment.authorization.expectedTrustPolicySha256 =
deployment.authorization.trustedKeysDirectory =

logging.loggers.root.channel = splitter
logging.loggers.root.level = information
logging.formatters.process.class = PatternFormatter
logging.formatters.process.pattern = [%Y-%m-%d %H-%M-%S.%i][%p][%s]: %t
logging.channels.console.class = ConsoleChannel
logging.channels.console.formatter = process
logging.channels.file.class = FileChannel
logging.channels.file.path = ${application.dir}logs/pdr-launcher.log
logging.channels.file.rotation = 10 M
logging.channels.file.archive = number
logging.channels.file.purgeCount = 10
logging.channels.file.formatter = process
logging.channels.splitter.class = SplitterChannel
logging.channels.splitter.channels = console,file

osp.bundleRepository = ${application.dir}bundles/
osp.bundleMonitor.enabled = true
osp.bundleMonitor.intervalMilliseconds = 1000
osp.bundleMonitor.stableScanCount = 2
osp.bundleMonitor.stateDirectory = ${application.dir}data/bundle-manager/
osp.bundleMonitor.inProcessReloadEnabled = false
osp.bundleMonitor.authorization.required = false
osp.bundleMonitor.authorization.repositoryId =
osp.bundleMonitor.authorization.evidenceDirectory =
osp.bundleMonitor.authorization.trustPolicyFile =
osp.bundleMonitor.authorization.expectedTrustPolicyId =
osp.bundleMonitor.authorization.expectedTrustPolicySha256 =
osp.bundleMonitor.authorization.trustedKeysDirectory =
osp.codeCache = ${application.dir}codeCache
osp.data = ${application.dir}data
