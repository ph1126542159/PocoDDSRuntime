logging.loggers.root.channel = console
logging.loggers.root.level = information
logging.formatters.console.class = PatternFormatter
logging.formatters.console.pattern = [%Y-%m-%d %H:%M:%S.%i][%p][%s]: %t
logging.channels.console.class = ConsoleChannel
logging.channels.console.formatter = console

osp.bundleRepository = ${application.dir}bundles
osp.codeCache = ${application.dir}codeCache
osp.data = ${application.dir}data
osp.autoUpdateCodeCache = true
osp.sharedCodeCache = true

qt3d.scene = rotating-cube
qt3d.renderBackend = rhi
qt3d.frameIntervalMilliseconds = 16
