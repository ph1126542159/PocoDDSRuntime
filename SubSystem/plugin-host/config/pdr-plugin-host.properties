# Required exact symbolic name of the isolated plugin.
pluginHost.pluginId =
# Explicit dependency allowlist. osp.core is always allowed.
pluginHost.allowedBundles =
pluginHost.heartbeatFile = ${application.dir}plugin-host.heartbeat
# This name is consumed by the main Runtime process-detail endpoint.
pluginHost.stateFile = ${application.dir}pdr-process-status.json
pluginHost.heartbeatIntervalMilliseconds = 1000

osp.bundleRepository = ${application.dir}bundles/
osp.codeCache = ${application.dir}codeCache
osp.data = ${application.dir}data
logging.loggers.root.channel = console
logging.loggers.root.level = information
logging.channels.console.class = ConsoleChannel
