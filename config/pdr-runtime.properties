logging.loggers.root.channel = splitter
logging.loggers.root.level = information
logging.formatters.console.class = PDRAlignedFormatter
# Fixed-width module column. Long names keep their first N characters.
logging.formatters.console.moduleWidth = 20
logging.channels.console.class = ConsoleChannel
logging.channels.console.formatter = console
logging.channels.file.class = FileChannel
logging.channels.file.path = ${application.dir}logs/pdr-runtime.log
logging.channels.file.rotation = 10 M
logging.channels.file.archive = number
logging.channels.file.purgeCount = 10
logging.channels.file.formatter = console
logging.channels.splitter.class = SplitterChannel
logging.channels.splitter.channels = console,file

osp.bundleRepository = ${application.dir}bundles/
# Stable runtime mode: bundle package changes are applied on the next explicit
# runtime restart. Full hot reload temporarily unmaps /login, /home and APIs.
osp.bundleMonitor.enabled = false
osp.bundleMonitor.intervalMilliseconds = 1000
osp.codeCache = ${application.dir}codeCache
osp.data = ${application.dir}data

# Ordered child-process startup configuration.
pdr.subprocess.configuration = ${application.dir}pdr-subprocesses.properties
pdr.subprocess.shutdownTimeoutMilliseconds = 5000

# macchina.io OSP Web manager. HTTP/HTTPS, authentication and request
# dispatching are provided by platform/OSP bundles, not by the webui tree.
security.profile = development
osp.web.server.host = 127.0.0.1
osp.web.server.port = 9080
osp.web.server.securePort = 0
osp.web.rootRedirect = /login/
# Empty keeps the local development UI unauthenticated. Set to osp.auth and
# configure auth.simple.* to enable the migrated SimpleAuth bundle.
osp.web.authServiceName =
auth.simple.enable = false

# Business tracing. Empty endpoint keeps local WebUI tracing enabled without
# requiring a Collector. Example: http://127.0.0.1:4318/v1/traces
observability.otlpHttpEndpoint =
observability.metrics.serviceName = pdr-runtime
observability.metrics.serviceInstanceId =
observability.metrics.otlpHttpEndpoint =
observability.metrics.otlpCaCertificatePath =
observability.metrics.otlpClientCertificatePath =
observability.metrics.otlpClientKeyPath =
observability.metrics.otlpInsecureSkipVerify = false
observability.metrics.offlineCachePath = data/metrics/otlp-cache
observability.metrics.offlineCacheMaximumFiles = 1000
observability.metrics.exportIntervalMilliseconds = 10000
observability.metrics.exportTimeoutMilliseconds = 5000
observability.metrics.maximumSeries = 2000
observability.history.path = ${application.dir}data/business-traces/
observability.history.retentionDays = 10

# Fast DDS service domain shared by the runtime and its clients.
pdr.fastdds.domainId = 0

# Migrated macchina.io services.
deviceStatus.messages.maxAge = 720
mobile.backend = memory
mobile.legato.cmPath = /legato/systems/current/bin/cm

# Optional physical devices. They stay disabled for a portable default startup.
# Every family accepts an indexed form: pdr.<family>.count followed by
# pdr.<family>.0.*, pdr.<family>.1.*, etc. When count is present it is
# authoritative; the legacy single-instance keys below remain compatible.
# Enabled devices are required by readiness unless an instance explicitly sets
# pdr.<family>.N.required = false.
pdr.simulation.count = 1
pdr.simulation.0.id = simulation-1

pdr.modbus.enabled = false
pdr.modbus.host = 127.0.0.1
pdr.modbus.port = 502
pdr.modbus.unitId = 1
pdr.modbus.timeoutMilliseconds = 2000
pdr.modbus.readRetryAttempts = 1
pdr.modbus.retryDelayMilliseconds = 50

pdr.serial.enabled = false
pdr.serial.transport = port
pdr.serial.port = COM1
pdr.serial.baudRate = 115200
pdr.serial.parameters = 8N1
pdr.serial.flowControl = none
pdr.serial.reconnectEnabled = true
pdr.serial.reconnectDelayMilliseconds = 250
pdr.serial.readTimeoutMilliseconds = 250

pdr.gnss.enabled = false
pdr.gnss.transport = port
pdr.gnss.port = COM1
pdr.gnss.baudRate = 9600
pdr.gnss.reconnectEnabled = true
pdr.gnss.reconnectDelayMilliseconds = 250
pdr.gnss.readTimeoutMilliseconds = 250
pdr.gnss.staleAfterMilliseconds = 5000

pdr.gpio.enabled = false
pdr.gpio.pin = 17
pdr.gpio.direction = in
pdr.gpio.sysfsRoot = /sys/class/gpio
pdr.gpio.manageExport = true
pdr.gpio.exportTimeoutMilliseconds = 1000

pdr.xbee.enabled = false
pdr.xbee.id = xbee-sensor-1
pdr.xbee.transport = port
pdr.xbee.port = COM1
pdr.xbee.baudRate = 9600
pdr.xbee.escapedApiMode = false
pdr.xbee.sourceAddress = 0013A200405291AB
pdr.xbee.analogChannel = 0
# raw, millivolts, temperature or humidity
pdr.xbee.conversion = raw
pdr.xbee.physicalQuantity = raw
pdr.xbee.physicalUnit = count
pdr.xbee.reconnectEnabled = true
pdr.xbee.reconnectDelayMilliseconds = 250
pdr.xbee.receiveTimeoutMilliseconds = 250
pdr.xbee.staleAfterMilliseconds = 5000

pdr.can.enabled = false
pdr.can.transport = socketcan
pdr.can.id = can-sensor-1
pdr.can.interface = can0
pdr.can.frameId = 0x123
pdr.can.extended = false
pdr.can.bitOffset = 0
pdr.can.bitLength = 16
pdr.can.bitOrder = little
pdr.can.signed = false
pdr.can.factor = 1
pdr.can.offset = 0
pdr.can.physicalQuantity = raw
pdr.can.physicalUnit = count
pdr.can.reconnectEnabled = true
pdr.can.reconnectDelayMilliseconds = 250
pdr.can.receiveTimeoutMilliseconds = 250
pdr.can.staleAfterMilliseconds = 2000

pdr.led.enabled = false
pdr.led.id = status-led
pdr.led.path = /sys/class/leds/status

