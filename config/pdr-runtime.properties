logging.loggers.root.channel = splitter
logging.loggers.root.level = information
logging.formatters.console.class = PDRAlignedFormatter
# Fixed-width module column. Long names keep their first N characters.
logging.formatters.console.moduleWidth = 20
logging.channels.console.class = ConsoleChannel
logging.channels.console.formatter = console
logging.channels.file.class = FileChannel
logging.channels.file.path = ${application.dir}logs/pdr-runtime.log
logging.channels.file.rotation = 10 M
logging.channels.file.archive = number
logging.channels.file.purgeCount = 10
logging.channels.file.formatter = console
logging.channels.splitter.class = SplitterChannel
logging.channels.splitter.channels = console,file

osp.bundleRepository = ${application.dir}bundles/
# Stable runtime mode: bundle package changes are applied on the next explicit
# runtime restart. Full hot reload temporarily unmaps /login, /home and APIs.
osp.bundleMonitor.enabled = false
osp.bundleMonitor.intervalMilliseconds = 1000
osp.bundleMonitor.stableScanCount = 2
osp.bundleMonitor.stateDirectory = ${application.dir}data/bundle-manager/
# Native Bundle libraries are process-scoped. Production keeps live replacement
# disabled; a validated repository change is journaled as restartRequired.
osp.bundleMonitor.inProcessReloadEnabled = false
# Production can require an Ed25519 publisher attestation for every repository
# candidate. Evidence and trust roots must remain outside osp.bundleRepository.
# Required evidence uses attestation schema v2 with a positive monotonic
# rolloutSequence plus bound release-manifest/SBOM provenance. stateDirectory
# owns the durable anti-replay and accepted-provenance high-water mark.
osp.bundleMonitor.authorization.required = false
osp.bundleMonitor.authorization.repositoryId =
osp.bundleMonitor.authorization.evidenceDirectory =
osp.bundleMonitor.authorization.trustPolicyFile =
osp.bundleMonitor.authorization.expectedTrustPolicyId =
osp.bundleMonitor.authorization.expectedTrustPolicySha256 =
osp.bundleMonitor.authorization.trustedKeysDirectory =
osp.codeCache = ${application.dir}codeCache
osp.data = ${application.dir}data

# Ordered child-process startup configuration.
pdr.subprocess.configuration = ${application.dir}pdr-subprocesses.properties
pdr.subprocess.shutdownTimeoutMilliseconds = 5000
# Exact Bundle IDs and prefix patterns ending in * that operators may manage online.
# OSP, Poco, pdr.platform.* and pdr.webui.* remain protected even if a broad pattern matches.
pdr.management.manageableBundles = pdr.service.*,pdr.device.*,pdr.alert.*,pdr.plugin.*

# External OSP plugins are in-process native libraries. Repeated lifecycle
# failures are persisted and block both later starts and automatic startup on
# the next Runtime launch. Native process crashes still require process-level
# supervision; this guard does not claim to sandbox arbitrary plugin code.
pdr.plugins.quarantine.enabled = true
pdr.plugins.quarantine.failureThreshold = 3
pdr.plugins.quarantine.path = ${application.dir}data/plugin-quarantine.json
# Development defaults to local unauthenticated management. Production validation
# requires this flag and a non-empty token supplied only through the named environment.
pdr.management.authentication.required = false
pdr.management.authentication.tokenEnvironment =
# File-backed secrets support atomic rotation without restarting Runtime. Configure
# exactly one of tokenEnvironment/tokenFile for each identity.
pdr.management.authentication.tokenFile =
# Optional least-privilege principals. The legacy token above remains an all-permission
# principal for compatibility. Each token value is read only from its environment.
pdr.management.authentication.principals.count = 0
# pdr.management.authentication.principals.0.id = operator
# pdr.management.authentication.principals.0.tokenEnvironment = PDR_OPERATOR_TOKEN
# pdr.management.authentication.principals.0.permissions = protocol.manage,process.manage,bundle.manage
pdr.management.idempotency.requireRequestId = false
pdr.management.idempotency.retention = 1000
pdr.management.idempotency.ttlMilliseconds = 86400000
pdr.management.idempotency.persistence.enabled = true
pdr.management.idempotency.persistence.path = ${application.dir}management-idempotency.json
pdr.management.audit.enabled = true
pdr.management.audit.path = ${application.dir}management-audit.jsonl
pdr.management.audit.maximumBytes = 4194304
pdr.management.tasks.workerCount = 2
pdr.management.tasks.capacity = 100
pdr.management.tasks.retention = 1000
pdr.management.tasks.health.degradedWaitMilliseconds = 30000
pdr.management.tasks.persistence.enabled = true
pdr.management.tasks.persistence.path = ${application.dir}management-tasks.json

# Per-Bundle/module workload lanes. Work submitted through the ResourceGovernor
# is isolated by owner; queue and execution deadlines apply backpressure without
# terminating arbitrary C++ threads. Execution timeout cancellation is cooperative.
pdr.resourceGovernor.default.maximumConcurrency = 2
pdr.resourceGovernor.default.queueCapacity = 128
pdr.resourceGovernor.default.queueTimeoutMilliseconds = 1000
pdr.resourceGovernor.default.executionTimeoutMilliseconds = 30000
pdr.resourceGovernor.default.failureThreshold = 5
pdr.resourceGovernor.default.circuitResetMilliseconds = 10000
pdr.resourceGovernor.overrides.count = 0
# pdr.resourceGovernor.overrides.0.owner = pdr.service.workflowRuntime
# pdr.resourceGovernor.overrides.0.maximumConcurrency = 4
# pdr.resourceGovernor.overrides.0.queueCapacity = 256
# pdr.resourceGovernor.overrides.0.queueTimeoutMilliseconds = 2000
# pdr.resourceGovernor.overrides.0.executionTimeoutMilliseconds = 60000
# pdr.resourceGovernor.overrides.0.failureThreshold = 5
# pdr.resourceGovernor.overrides.0.circuitResetMilliseconds = 10000

# macchina.io OSP Web manager. HTTP/HTTPS, authentication and request
# dispatching are provided by platform/OSP bundles, not by the webui tree.
security.profile = development
osp.web.server.host = 127.0.0.1
osp.web.server.port = 9080
osp.web.server.securePort = 0
osp.web.rootRedirect = /login/
# Empty keeps the local development UI unauthenticated, but /webevent remains
# fail-closed with HTTP 401. Set to osp.auth and configure auth.simple.* only
# for local compatibility tests; production must provide a stronger AuthService.
osp.web.authServiceName =
osp.web.tokenValidatorName =
# To reuse management Principals for OSP Basic/Bearer authentication, set:
# osp.web.authServiceName = pdr.auth.management
# osp.web.tokenValidatorName = pdr.auth.management.tokens
auth.simple.enable = false

# Business tracing. Empty endpoint keeps local WebUI tracing enabled without
# requiring a Collector. Example: http://127.0.0.1:4318/v1/traces
observability.otlpHttpEndpoint =
observability.metrics.serviceName = pdr-runtime
observability.metrics.serviceInstanceId =
observability.metrics.otlpHttpEndpoint =
observability.metrics.otlpCaCertificatePath =
observability.metrics.otlpClientCertificatePath =
observability.metrics.otlpClientKeyPath =
observability.metrics.otlpInsecureSkipVerify = false
observability.metrics.offlineCachePath = data/metrics/otlp-cache
observability.metrics.offlineCacheMaximumFiles = 1000
observability.metrics.exportIntervalMilliseconds = 10000
observability.metrics.exportTimeoutMilliseconds = 5000
observability.metrics.maximumSeries = 2000
observability.history.path = ${application.dir}data/business-traces/
observability.history.retentionDays = 10

# Fast DDS service domain shared by the runtime and its clients.
pdr.fastdds.domainId = 0

# Runtime-instance membership over Fast DDS. instanceId must be stable across
# restarts and unique within the DDS domain; configure it explicitly when more
# than one Runtime can run on the same host. Receiver monotonic time determines
# expiry, and the SQLite high-water mark prevents incarnation reuse.
# This is health discovery only: it is not quorum, leader election or consensus.
# pdr.membership.instanceId = edge-a:runtime
pdr.membership.role = runtime
pdr.membership.endpoint =
pdr.membership.capabilities = health,service-registry
pdr.membership.topic = pdr.runtime.membership.v1
pdr.membership.heartbeatIntervalMilliseconds = 1000
pdr.membership.heartbeatTtlMilliseconds = 5000
pdr.membership.tombstoneRetentionMilliseconds = 30000
pdr.membership.maximumMembers = 1024
# pdr.membership.database = ${application.dir}data/membership/incarnations.sqlite

# Cross-Runtime Service Directory. Only explicitly configured or registered
# ServiceAdvertisementProvider endpoints are advertised; ordinary OSP services
# never become remotely callable automatically. Routing selects an endpoint but
# does not proxy/invoke it. Tags are routing metadata, not authorization claims.
pdr.serviceDirectory.topic = pdr.runtime.service-directory.v1
pdr.serviceDirectory.publishIntervalMilliseconds = 1000
pdr.serviceDirectory.ttlMilliseconds = 5000
pdr.serviceDirectory.tombstoneRetentionMilliseconds = 30000
pdr.serviceDirectory.maximumInstances = 4096
pdr.serviceDirectory.maximumInstancesPerService = 256
pdr.serviceDirectory.advertisements.count = 0
# pdr.serviceDirectory.advertisements.0.serviceName = pdr.health.v1
# pdr.serviceDirectory.advertisements.0.instanceId = edge-a:health
# pdr.serviceDirectory.advertisements.0.endpoint = http://edge-a:9080/health
# pdr.serviceDirectory.advertisements.0.protocol = http
# pdr.serviceDirectory.advertisements.0.zone = plant-a
# pdr.serviceDirectory.advertisements.0.tags = health,http
# pdr.serviceDirectory.advertisements.0.state = ready

# Governed cross-Runtime invocation. This layer never exposes a generic proxy:
# protocol Bundles must explicitly register a ServiceInvocationProvider. The
# total deadline includes routing, Provider execution and retry backoff.
pdr.serviceClient.maximumProviders = 256
pdr.serviceClient.maximumAttempts = 3
pdr.serviceClient.timeoutMilliseconds = 5000
pdr.serviceClient.initialBackoffMilliseconds = 50
pdr.serviceClient.maximumBackoffMilliseconds = 1000
pdr.serviceClient.backoffMultiplier = 2.0
pdr.serviceClient.circuitFailureThreshold = 3
pdr.serviceClient.circuitResetMilliseconds = 5000
pdr.serviceClient.maximumCircuitEntries = 4096
pdr.serviceClient.circuitIdleRetentionMilliseconds = 600000
pdr.serviceClient.maximumPayloadBytes = 1048576
pdr.serviceClient.maximumMetadataEntries = 64
pdr.serviceClient.maximumMetadataBytes = 65536
# Default off for compatibility. When enabled every invocation must provide a
# principal and pass CapabilityRuntime use on <service>/<operation>.
pdr.serviceClient.authorizationRequired = false
# Structured invocation events are adapted to BusinessTracer by the Runtime
# Bundle. No payload, metadata, endpoint or credential value is recorded.
pdr.serviceClient.audit.enabled = true
pdr.serviceClient.audit.maximumActiveTraces = 4096
pdr.serviceClient.idempotency.enabled = true
pdr.serviceClient.idempotency.maximumEntries = 10000
pdr.serviceClient.idempotency.retentionMilliseconds = 86400000
# Optional override. When omitted, the Bundle persistent directory is used.
# pdr.serviceClient.idempotency.database = D:/PocoDDSRuntime/data/service-client-invocations.sqlite

# Optional HTTP(S) invocation Provider. It is disabled until operators provide
# an explicit host and port egress policy. Caller metadata cannot override
# Authorization, Host, Cookie or arbitrary headers. Plain HTTP, loopback,
# private and link-local targets require separate explicit opt-ins.
pdr.serviceClient.httpProvider.enabled = false
pdr.serviceClient.httpProvider.allowedHosts =
pdr.serviceClient.httpProvider.allowedPorts = 443
pdr.serviceClient.httpProvider.allowPlainHttp = false
pdr.serviceClient.httpProvider.allowLoopback = false
pdr.serviceClient.httpProvider.allowPrivateNetworks = false
pdr.serviceClient.httpProvider.allowLinkLocal = false
pdr.serviceClient.httpProvider.maximumRequestBytes = 1048576
pdr.serviceClient.httpProvider.maximumResponseBytes = 1048576
pdr.serviceClient.httpProvider.maximumTimeoutMilliseconds = 5000
pdr.serviceClient.httpProvider.caCertificate =
pdr.serviceClient.httpProvider.authorizationEnvironment =
# Target-bound credentials avoid sharing one Authorization value across hosts.
# pdr.serviceClient.httpProvider.credentials.required = true
# pdr.serviceClient.httpProvider.credentials.count = 1
# pdr.serviceClient.httpProvider.credentials.0.service = orders.v1
# pdr.serviceClient.httpProvider.credentials.0.operation = read-*
# pdr.serviceClient.httpProvider.credentials.0.host = api.example.com
# pdr.serviceClient.httpProvider.credentials.0.port = 443
# pdr.serviceClient.httpProvider.credentials.0.authorizationEnvironment = PDR_ORDERS_AUTHORIZATION
# Alternatively use authorizationFile for hot rotation. The file must contain
# one non-empty header value and, by default, have restricted ACL/permissions.
# pdr.serviceClient.httpProvider.credentials.0.authorizationFile = ${application.dir}secrets/orders.authorization
pdr.serviceClient.httpProvider.credentials.required = false
pdr.serviceClient.httpProvider.credentials.count = 0
pdr.serviceClient.httpProvider.credentials.requireRestrictedFiles = true
pdr.serviceClient.httpProvider.credentials.reloadIntervalMilliseconds = 1000

# Durable workflow instances. An empty override is not allowed; the Bundle
# otherwise uses its OSP persistent directory automatically.
pdr.workflow.schedulerEnabled = true
pdr.workflow.schedulerIntervalMilliseconds = 100
pdr.workflow.schedulerJitterMilliseconds = 0
# pdr.workflow.database = ${application.dir}data/workflows/instances.sqlite

# Durable outbound Store-and-Forward queue. Delivery Providers are discovered
# through the OSP registry; messages remain pending while their Provider is offline.
pdr.outbox.schedulerEnabled = true
pdr.outbox.schedulerIntervalMilliseconds = 100
pdr.outbox.schedulerJitterMilliseconds = 0
pdr.outbox.maintenanceIntervalSeconds = 60
pdr.outbox.maximumActiveMessages = 10000
pdr.outbox.maximumPayloadBytes = 1048576
pdr.outbox.maximumAttempts = 8
pdr.outbox.initialRetryDelayMilliseconds = 1000
pdr.outbox.maximumRetryDelayMilliseconds = 60000
pdr.outbox.deliveryBatchSize = 100
pdr.outbox.terminalRetentionHours = 168

# Transactional configuration runtime. The SQLite journal stores generation,
# idempotency and crash-recovery evidence; blank uses the Bundle data directory.
# pdr.configurationRuntime.database = ${application.dir}data/configuration/transactions.sqlite

# Durable Bundle lifecycle maintenance journal. SQLite WAL/FULL persists plans,
# request idempotency and crash-recovery intent across Runtime restarts; blank is
# invalid and an omitted value uses the Lifecycle Bundle persistent directory.
# pdr.lifecycleRuntime.database = ${application.dir}data/lifecycle/maintenance.sqlite

# Immutable runtime Schema Registry. Providers register versioned JSON Schema
# contracts through OSP; blank uses the Bundle persistent data directory.
# pdr.schemaRegistry.database = ${application.dir}data/schema-registry/schemas.sqlite
# Bundle capability policy is separate from component self-declarations. The
# runtime enforces default deny at guarded service, topic, configuration,
# device and schema entry points. Prefix patterns may use one trailing '*'.
pdr.capabilityRuntime.policy = ${application.dir}config/pdr-capability-policy.json
# SQLite WAL/FULL is authoritative after the first seed. A changed policy file
# is reported as source drift and never silently overwrites a live generation.
# pdr.capabilityRuntime.database = ${application.dir}data/capabilities/capabilities.sqlite
pdr.capabilityRuntime.auditMaximumRecords = 10000
pdr.capabilityRuntime.memoryAuditCapacity = 2048
# High-frequency guarded paths may use short-lived allow-only decision leases.
# Policy generation changes invalidate all leases before the next operation.
pdr.capabilityRuntime.leaseEnabled = true
pdr.capabilityRuntime.leaseDurationMilliseconds = 250
pdr.capabilityRuntime.leaseMaximumUses = 1024
pdr.capabilityRuntime.leaseCapacity = 4096
# pdr.outbox.database = ${application.dir}data/outbox/messages.sqlite

