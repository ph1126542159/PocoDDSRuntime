pdr_robot_runtime:
  ros__parameters:
    backend: in_memory
    world: empty
    hardware_description: mock://robot
    simulator_name: external-simulator
    simulator_feedback_timeout_ms: 500
    tick_period_ms: 20
    maximum_linear_speed: 1.0
    maximum_angular_speed: 1.0
    command_timeout_ms: 250
    joint_names: []
    joint_min_positions: []
    joint_max_positions: []
    joint_max_velocities: []
    joint_max_efforts: []
    # Optional reference modules: warehouse, inspection, pick_place.
    # Custom modules implement RobotBusinessModule and register without changing the runtime.
    business_modules: []
    # Explicit trusted DLL/SO paths only; directories are never scanned automatically.
    business_plugins: []
