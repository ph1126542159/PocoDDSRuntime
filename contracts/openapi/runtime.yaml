openapi: 3.1.0
info:
  title: PocoDDSRuntime Management API
  version: 0.1.0
paths:
  /api/v1/topology:
    get:
      operationId: getRuntimeTopology
      summary: Return the current Runtime topology with explicit Host, Process, Bundle and Service ownership
      responses:
        "200":
          description: Scoped Runtime topology
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTopology" }
  /api/v1/protocols:
    get:
      operationId: listProtocols
      summary: List managed protocol instances and structured diagnostics
      responses:
        "200":
          description: Protocol inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtocolInventory" }
    post:
      operationId: manageProtocol
      summary: Open, close or restart a protocol instance
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolLifecycleRequest" }
      responses:
        "200": { description: Protocol lifecycle operation completed }
        "202":
          description: Protocol lifecycle task accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTaskAccepted" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks protocol.manage }
        "409": { description: Request ID is already in progress or was reused for different content }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery, or asynchronous task persistence is unavailable }
  /api/v1/diagnostic-events:
    get:
      operationId: listDiagnosticEvents
      summary: List deduplicated device and protocol failure transitions with trace links
      responses:
        "200":
          description: Recent diagnostic failure and recovery events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosticEventInventory" }
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: List deduplicated alert states and the effective runtime policy
      responses:
        "200":
          description: Current and recently resolved alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertInventory" }
  /api/v1/alert-history:
    get:
      operationId: listAlertHistory
      summary: List locally persisted alert delivery transitions
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Persisted alert transition history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertHistory" }
  /api/v1/alert-sinks:
    get:
      operationId: listAlertSinks
      summary: List registered alert delivery sinks without exposing secrets
      responses:
        "200":
          description: Registered alert sink inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertSinkInventory" }
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: List active device adapters registered with the runtime
      responses:
        "200":
          description: Active device inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInventory"
  /api/v1/system-metrics:
    get:
      responses: { "200": { description: System metric history } }
  /api/v1/process-logs:
    get:
      responses: { "200": { description: Process log records } }
  /api/v1/process-detail:
    get:
      operationId: getProcessDetail
      summary: Return process details and authoritative Bundle management flags
      responses:
        "200":
          description: Process details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessDetail" }
  /api/v1/process-lifecycle:
    post:
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessLifecycleRequest" }
      responses:
        "200": { description: Lifecycle action accepted }
        "202":
          description: Process lifecycle task accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTaskAccepted" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks process.manage }
        "409": { description: Request ID is already in progress or was reused for different content }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery, or asynchronous task persistence is unavailable }
  /api/v1/bundle-lifecycle:
    post:
      operationId: manageBundle
      summary: Start, stop or restart a backend-approved manageable Bundle
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BundleLifecycleRequest" }
      responses:
        "200":
          description: Bundle lifecycle action completed
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BundleLifecycleResponse" }
                  - { $ref: "#/components/schemas/IdempotentReplayResponse" }
        "202":
          description: Bundle lifecycle task accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTaskAccepted" }
        "403": { description: Principal lacks bundle.manage, or Bundle is protected }
        "404": { description: Bundle not found }
        "401": { description: Missing or invalid management Bearer token }
        "409": { description: Request ID is already in progress or was reused for different content }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery, or asynchronous task persistence is unavailable }
  /api/v1/process-config:
    get:
      operationId: getEditableRuntimeConfiguration
      summary: Read the current online-editable configuration without secrets
      responses:
        "200":
          description: Current editable Runtime configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditableConfiguration" }
    post:
      operationId: updateRuntimeConfiguration
      summary: Validate, persist and apply one allowlisted Runtime property transactionally
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationUpdateRequest" }
      responses:
        "200":
          description: Configuration validated, persisted and applied
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ConfigurationUpdateResponse" }
                  - { $ref: "#/components/schemas/IdempotentReplayResponse" }
        "400": { description: Invalid request or configuration value; nothing persisted }
        "403": { description: Principal lacks configuration.manage, or property is not online-editable }
        "404": { description: Property is not present in the persistent Runtime file }
        "409":
          description: Apply failed after persistence and the transaction attempted rollback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationUpdateFailure" }
        "401": { description: Missing or invalid management Bearer token }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery }
  /api/v1/management-audit:
    get:
      operationId: listManagementAudit
      summary: Query recent persisted management operation audit events
      security: [{ ManagementBearer: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { in: query, name: operation, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [succeeded, denied, failed, replayed] } }
        - { in: query, name: principal, schema: { type: string } }
      responses:
        "200":
          description: Newest matching audit events first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementAuditInventory" }
        "400": { description: Invalid filter }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks audit.read }
  /api/v1/identity:
    get:
      operationId: getManagementIdentitySnapshot
      summary: Read the active management-identity generation without exposing identities or tokens
      security: [{ ManagementBearer: [] }]
      responses:
        "200":
          description: Active identity snapshot metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentitySnapshot" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks identity.manage }
    post:
      operationId: reloadManagementIdentitySnapshot
      summary: Atomically reload file-backed management tokens from the active configuration
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      responses:
        "200":
          description: Candidate snapshot validated and atomically activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityReloadResponse" }
        "400": { description: Candidate secret source is invalid; the previous generation remains active }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks identity.manage }
        "409": { description: Request ID is already in progress or was reused }
        "428": { description: Management request ID is required by Runtime policy }
  /api/v1/management-tasks:
    get:
      operationId: listManagementTasks
      summary: List retained asynchronous management tasks
      security: [{ ManagementBearer: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { in: query, name: state, schema: { $ref: "#/components/schemas/ManagementTaskState" } }
        - { in: query, name: operation, schema: { type: string } }
      responses:
        "200":
          description: Newest retained tasks first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTaskInventory" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks task.read }
    post:
      operationId: cancelManagementTask
      summary: Cancel a task that is still queued
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagementTaskCancelRequest" }
      responses:
        "200": { description: Queued task cancelled }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks task.cancel }
        "404": { description: Task not found }
        "409": { description: Running or terminal task cannot be cancelled }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery }
  /api/v1/management-tasks/{taskId}:
    get:
      operationId: getManagementTask
      summary: Get one retained asynchronous management task
      security: [{ ManagementBearer: [] }]
      parameters:
        - { in: path, name: taskId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Task state and result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTask" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks task.read }
        "404": { description: Task not found }
  /api/v1/heartbeat-businesses:
    get:
      responses: { "200": { description: Heartbeat business records } }
  /api/v1/business-traces:
    get:
      responses: { "200": { description: Recent business traces } }
  /api/v1/business-trace-history:
    get:
      responses: { "200": { description: Persisted business trace history } }
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200": { description: Runtime process is live }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200": { description: Runtime is ready }
        "503": { description: Runtime is degraded or down }
  /health/detail:
    get:
      operationId: getHealthDetail
      responses:
        "200":
          description: Aggregated component health with actionable diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDetail"
components:
  parameters:
    ManagementRequestId:
      in: header
      name: X-PDR-Request-Id
      required: false
      description: Unique management operation ID. Required when pdr.management.idempotency.requireRequestId is true; identical retries return the completed result without executing again.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  securitySchemes:
    ManagementBearer:
      type: http
      scheme: bearer
      description: Required for protected management APIs; principals receive explicit protocol.manage, process.manage, bundle.manage, configuration.manage, audit.read, task.read and task.cancel permissions
  schemas:
    IdempotentReplayResponse:
      type: object
      required: [message, requestId, idempotentReplay, operation, target, action]
      properties:
        message: { type: string }
        requestId: { type: string, minLength: 1 }
        idempotentReplay: { type: boolean, const: true }
        operation: { type: string, minLength: 1 }
        target: { type: string }
        action: { type: string, minLength: 1 }
    BundleLifecycleRequest:
      type: object
      additionalProperties: false
      required: [id, action]
      properties:
        id: { type: string, minLength: 1 }
        action: { type: string, enum: [start, stop, restart, reset-quarantine] }
        confirmPersistenceRecovery: { type: boolean, default: false }
        async: { type: boolean, default: false }
        startTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000, default: 30000 }
        notBeforeMilliseconds: { type: integer, minimum: 0, maximum: 3599999, default: 0 }
        executionTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000, default: 30000 }
    ProtocolLifecycleRequest:
      type: object
      additionalProperties: false
      required: [id, action]
      properties:
        id: { type: string, minLength: 1 }
        action: { type: string, enum: [open, close, restart] }
        async: { type: boolean, default: false }
        startTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000, default: 30000 }
        notBeforeMilliseconds: { type: integer, minimum: 0, maximum: 3599999, default: 0 }
        executionTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000, default: 30000 }
        stabilityWindowMilliseconds: { type: integer, minimum: 0, maximum: 300000, default: 0 }
    ProcessLifecycleRequest:
      type: object
      additionalProperties: false
      required: [id, action]
      properties:
        id: { type: string, minLength: 1 }
        action: { type: string, enum: [start, stop, restart] }
        async: { type: boolean, default: false }
        startTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000, default: 30000 }
        notBeforeMilliseconds: { type: integer, minimum: 0, maximum: 3599999, default: 0 }
        executionTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000, default: 30000 }
    ManagedBundle:
      type: object
      required: [id, name, version, state, manageable]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        state: { type: string, enum: [installed, resolved, starting, active, stopping, uninstalled] }
        manageable: { type: boolean }
        plugin: { type: boolean }
        protected: { type: boolean }
        compatible: { type: boolean }
        pluginApiVersion: { type: string }
        pluginAbiVersion: { type: string }
        pluginAbiFingerprint: { type: string }
        runtimeVersionRange: { type: string }
        compatibilityIssues:
          type: array
          items: { type: string }
        governanceStatus: { type: string, enum: [ready, incompatible, quarantined, protected, unmanaged] }
        quarantined: { type: boolean }
        quarantineFailureThreshold: { type: integer, minimum: 1 }
        quarantineTotalFailures: { type: integer, minimum: 0 }
        quarantineConsecutiveFailures: { type: integer, minimum: 0 }
        quarantineUpdatedMicroseconds: { type: integer, minimum: 0 }
        quarantineLastError: { type: string }
        quarantinePersistenceHealthy: { type: boolean }
        quarantineRecoveryRequired: { type: boolean }
        quarantinePersistenceError: { type: string }
        dependencies:
          type: array
          items:
            type: object
            required: [id, requestedVersion, available, compatible, availableVersion, state]
            properties:
              id: { type: string, minLength: 1 }
              requestedVersion: { type: string }
              available: { type: boolean }
              compatible: { type: boolean }
              availableVersion: { type: string }
              state: { type: string }
    ProcessDetail:
      type: object
      required: [schemaVersion, scope, process, children, bundles, services, serviceInventoryAuthority, resources, configurationScope]
      properties:
        schemaVersion: { type: integer, const: 2 }
        scope: { $ref: "#/components/schemas/ResourceScope" }
        process: { type: object }
        children: { type: array, items: { type: object } }
        bundles: { type: array, items: { $ref: "#/components/schemas/RuntimeBundle" } }
        services: { type: array, items: { $ref: "#/components/schemas/RuntimeService" } }
        serviceInventoryAuthority: { type: string, enum: [local-registry, child-status, unavailable] }
        resources: { type: object }
        configurationScope: { type: string, const: process }
    ResourceScope:
      type: object
      required: [hostId, runtimeId]
      properties:
        kind: { type: string, enum: [host, runtime, process, bundle, service, device, protocol] }
        hostId: { type: string, minLength: 1 }
        runtimeId: { type: string, minLength: 1 }
        processId: { type: string, minLength: 1 }
        bundleId: { type: string, minLength: 1 }
        serviceId: { type: string, minLength: 1 }
    ResourceOwner:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [host, runtime, process, bundle, service, external-supervisor] }
        id: { type: string, minLength: 1 }
    RuntimeService:
      type: object
      required: [kind, id, name, state, registrationState, health, processId, bundleId, ownerKnown, scope]
      properties:
        kind: { type: string, const: service }
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        state: { type: string, const: registered }
        registrationState: { type: string, const: registered }
        health: { type: string, enum: [unknown, up, degraded, down] }
        serviceType: { type: string }
        processId: { type: string, minLength: 1 }
        bundleId: { type: string }
        ownerKnown: { type: boolean }
        scope: { $ref: "#/components/schemas/ResourceScope" }
        owner:
          oneOf:
            - { $ref: "#/components/schemas/ResourceOwner" }
            - { type: "null" }
        lifecycleOwner:
          oneOf:
            - { $ref: "#/components/schemas/ResourceOwner" }
            - { type: "null" }
    RuntimeBundle:
      type: object
      required: [kind, id, name, version, state, processId, scope, owner, lifecycleOwner]
      properties:
        kind: { type: string, const: bundle }
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        state: { type: string, enum: [installed, resolved, starting, active, stopping, uninstalled] }
        processId: { type: string, minLength: 1 }
        scope: { $ref: "#/components/schemas/ResourceScope" }
        owner: { $ref: "#/components/schemas/ResourceOwner" }
        lifecycleOwner: { $ref: "#/components/schemas/ResourceOwner" }
    RuntimeTopology:
      type: object
      required: [schemaVersion, scope, host, runtime, mainProcess, hostResources, resourcesDeprecated, resourcesScope, processes, services, modules, modulesDeprecated, bundles]
      properties:
        schemaVersion: { type: integer, const: 2 }
        scope: { $ref: "#/components/schemas/ResourceScope" }
        host: { type: string, minLength: 1 }
        runtime: { type: object }
        mainProcess: { type: object }
        hostResources: { type: object }
        resourcesDeprecated: { type: boolean, const: true }
        resourcesScope: { type: string, const: host }
        resources:
          type: object
          deprecated: true
        processes: { type: array, items: { type: object } }
        services: { type: array, items: { $ref: "#/components/schemas/RuntimeService" } }
        modules: { type: array, maxItems: 0 }
        modulesDeprecated: { type: boolean, const: true }
        bundles: { type: array, items: { $ref: "#/components/schemas/RuntimeBundle" } }
    BundleLifecycleResponse:
      type: object
      required: [message, requestId, idempotentReplay]
      properties:
        message: { type: string }
        id: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        requestId: { type: string }
        idempotentReplay: { type: boolean }
    ConfigurationUpdateRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [key, value]
          properties:
            action: { type: string, const: apply }
            key: { type: string, minLength: 1 }
            value: { type: string }
        - type: object
          additionalProperties: false
          required: [action, transactionId]
          properties:
            action: { type: string, const: rollback }
            transactionId: { type: string, minLength: 1 }
    ConfigurationTransaction:
      type: object
      required: [transactionId, timestampMicroseconds, action, key, status]
      properties:
        transactionId: { type: string, minLength: 1 }
        timestampMicroseconds: { type: integer, minimum: 1 }
        action: { type: string, enum: [apply, rollback] }
        key: { type: string }
        status: { type: string, enum: [committed, rejected, rolled-back] }
        owner: { type: string }
        ownerRestarted: { type: boolean }
        rolledBack: { type: boolean }
        error: { type: string }
        remoteAddress: { type: string }
        principal: { type: string }
    ConfigurationRollback:
      type: object
      required: [transactionId, key, action, timestampMicroseconds]
      properties:
        transactionId: { type: string, minLength: 1 }
        key: { type: string, minLength: 1 }
        action: { type: string, enum: [apply, rollback] }
        timestampMicroseconds: { type: integer, minimum: 1 }
    EditableConfiguration:
      type: object
      required: [schemaVersion, managementAuthenticationRequired, managementSession, configuration, editable, rollbackFileAvailable]
      properties:
        schemaVersion: { type: integer, const: 1 }
        managementAuthenticationRequired: { type: boolean }
        managementSession:
          $ref: "#/components/schemas/ManagementSession"
        configuration: { type: object, additionalProperties: { type: string } }
        editable: { type: array, items: { type: string, minLength: 1 } }
        rollbackFileAvailable: { type: boolean }
        rollback: { $ref: "#/components/schemas/ConfigurationRollback" }
        transactions:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ConfigurationTransaction" }
    ConfigurationUpdateResponse:
      type: object
      required: [message, transactionId, action, key, value, validated, persisted, applied, owner, ownerRestarted, rolledBack, audited, requestId, idempotentReplay, principal]
      properties:
        message: { type: string }
        transactionId: { type: string, minLength: 1 }
        action: { type: string, enum: [apply, rollback] }
        key: { type: string, minLength: 1 }
        value: { type: string }
        validated: { type: boolean, const: true }
        persisted: { type: boolean, const: true }
        applied: { type: boolean, const: true }
        owner: { type: string }
        ownerRestarted: { type: boolean }
        rolledBack: { type: boolean, const: false }
        audited: { type: boolean, const: true }
        requestId: { type: string }
        idempotentReplay: { type: boolean }
        principal: { type: string }
    ManagementSession:
      type: object
      required: [authenticated, principal, permissions]
      properties:
        authenticated: { type: boolean }
        principal: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [protocol.manage, process.manage, bundle.manage, configuration.manage, audit.read, task.read, task.cancel]
    ManagementTaskState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, timed-out, interrupted]
    ManagementTask:
      type: object
      required: [id, operation, target, action, principal, requestId, state, interruptedFromState, recoveryPolicy, submittedMicroseconds, startedMicroseconds, finishedMicroseconds, startDeadlineMicroseconds, notBeforeMicroseconds, executionDeadlineMicroseconds, executionTimeoutMilliseconds, cancellationRequested, phase, phaseBeforeCancellation, cancellationMode, resourceKey, blockingTaskId, resourceWaitStartedMicroseconds, resourceAcquiredMicroseconds, resourceWaitMicroseconds]
      properties:
        id: { type: string, minLength: 1 }
        operation: { type: string }
        target: { type: string }
        action: { type: string }
        principal: { type: string }
        requestId: { type: string }
        state: { $ref: "#/components/schemas/ManagementTaskState" }
        interruptedFromState: { type: string, enum: ["", queued, running] }
        recoveryPolicy: { type: string, enum: [verify-before-retry] }
        submittedMicroseconds: { type: integer, minimum: 1 }
        startedMicroseconds: { type: integer, minimum: 0 }
        finishedMicroseconds: { type: integer, minimum: 0 }
        startDeadlineMicroseconds: { type: integer, minimum: 1 }
        notBeforeMicroseconds: { type: integer, minimum: 1 }
        executionDeadlineMicroseconds: { type: integer, minimum: 0 }
        executionTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000 }
        cancellationRequested: { type: boolean }
        phase: { type: string, enum: [queued, waiting-resource, executing, cancellation-requested, finished] }
        phaseBeforeCancellation: { type: string, enum: ["", queued, waiting-resource, executing] }
        cancellationMode: { type: string, enum: [cooperative] }
        resourceKey: { type: string, minLength: 1 }
        blockingTaskId: { type: string }
        resourceWaitStartedMicroseconds: { type: integer, minimum: 0 }
        resourceAcquiredMicroseconds: { type: integer, minimum: 0 }
        resourceWaitMicroseconds: { type: integer, minimum: 0 }
