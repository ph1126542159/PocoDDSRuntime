        digest: { type: string, pattern: "^[a-f0-9]{64}$" }
        participantCount: { type: integer, minimum: 0 }
        participants:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationParticipantCatalogEntry" }
        admissionGeneration: { type: integer, minimum: 0 }
        rejectedCount:
          type: integer
          minimum: 0
          maximum: 128
          description: Number of retained sanitized rejection records.
        admissionOverflow:
          type: boolean
          description: True when the bounded rejection diagnostic capacity was exceeded; readiness remains degraded until ConfigurationRuntime restarts.
        rejectedParticipants:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/ConfigurationParticipantAdmissionFailure" }
        expectationGeneration: { type: integer, minimum: 0 }
        expectationsReady:
          type: boolean
          description: True when all active Bundle-local participant declarations exactly match admitted participants and every declaration document is valid.
        declaredParticipantCount: { type: integer, minimum: 0, maximum: 1024 }
        declaredParticipants:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ConfigurationParticipantExpectation" }
        declarationIssueCount: { type: integer, minimum: 0 }
        declarationIssues:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationParticipantDeclarationIssue" }
        keyLifecycleGeneration: { type: integer, minimum: 0 }
        keyLifecyclesReady:
          type: boolean
