openapi: 3.1.0
info:
  title: PocoDDSRuntime Management API
  version: 0.1.0
paths:
  /api/v1/topology:
    get:
      operationId: getRuntimeTopology
      summary: Return the current Runtime topology with explicit Host, Process, Bundle and Service ownership
      responses:
        "200":
          description: Scoped Runtime topology
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTopology" }
  /api/v1/protocols:
    get:
      operationId: listProtocols
      summary: List managed protocol instances and structured diagnostics
      responses:
        "200":
          description: Protocol inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtocolInventory" }
    post:
      operationId: manageProtocol
      summary: Open, close or restart a protocol instance
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolLifecycleRequest" }
      responses:
        "200": { description: Protocol lifecycle operation completed }
        "202":
          description: Protocol lifecycle task accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTaskAccepted" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks protocol.manage }
        "409": { description: Request ID is already in progress or was reused for different content }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery, or asynchronous task persistence is unavailable }
  /api/v1/diagnostic-events:
    get:
      operationId: listDiagnosticEvents
      summary: List deduplicated device and protocol failure transitions with trace links
      responses:
        "200":
          description: Recent diagnostic failure and recovery events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosticEventInventory" }
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: List deduplicated alert states and the effective runtime policy
      responses:
        "200":
          description: Current and recently resolved alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertInventory" }
  /api/v1/alert-history:
    get:
      operationId: listAlertHistory
      summary: List locally persisted alert delivery transitions
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Persisted alert transition history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertHistory" }
  /api/v1/alert-sinks:
    get:
      operationId: listAlertSinks
      summary: List registered alert delivery sinks without exposing secrets
      responses:
        "200":
          description: Registered alert sink inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertSinkInventory" }
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: List active device adapters registered with the runtime
      responses:
        "200":
          description: Active device inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInventory"
  /api/v1/system-metrics:
    get:
      responses: { "200": { description: System metric history } }
  /api/v1/process-logs:
    get:
      responses: { "200": { description: Process log records } }
  /api/v1/process-detail:
    get:
      operationId: getProcessDetail
      summary: Return process details and authoritative Bundle management flags
      responses:
        "200":
          description: Process details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessDetail" }
  /api/v1/process-dependencies:
    get:
      operationId: getProcessDependencyGraph
      summary: Return the authoritative managed-process dependency DAG and current blocking reasons
      responses:
        "200":
          description: Topologically ordered process dependency graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessDependencyGraph" }
        "503":
          description: ProcessManagement has not initialized
  /api/v1/process-dependencies/impact:
    get:
      operationId: analyzeProcessLifecycleImpact
      summary: Build a side-effect-free managed-process lifecycle impact plan
      description: The response uses the same authoritative DAG ordering as SubprocessManager. Stop and restart plans include transitively affected dependents; start plans include the prerequisite closure. This endpoint does not execute the action and its generation is a point-in-time snapshot.
      parameters:
        - in: query
          name: target
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        - in: query
          name: action
          required: true
          schema: { type: string, enum: [start, stop, restart] }
      responses:
        "200":
          description: Lifecycle impact plan or a denied local-management decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessLifecycleImpactPlan" }
        "400": { description: Missing, duplicate or unsupported impact query parameter }
        "503": { description: ProcessManagement has not initialized }
  /api/v1/process-lifecycle:
    post:
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessLifecycleRequest" }
      responses:
        "200": { description: Lifecycle action accepted }
        "202":
          description: Process lifecycle task accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTaskAccepted" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks process.manage }
        "409": { description: Request ID is already in progress or was reused for different content }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery, or asynchronous task persistence is unavailable }
  /api/v1/bundle-lifecycle:
    post:
      operationId: manageBundle
      summary: Start, stop or restart a backend-approved manageable Bundle
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BundleLifecycleRequest" }
      responses:
        "200":
          description: Bundle lifecycle action completed
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BundleLifecycleResponse" }
                  - { $ref: "#/components/schemas/IdempotentReplayResponse" }
        "202":
          description: Bundle lifecycle task accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTaskAccepted" }
        "403": { description: Principal lacks bundle.manage, or Bundle is protected }
        "404": { description: Bundle not found }
        "401": { description: Missing or invalid management Bearer token }
        "409": { description: Request ID is already in progress or was reused for different content }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery, or asynchronous task persistence is unavailable }
  /api/v1/process-config:
    get:
      operationId: getEditableRuntimeConfiguration
      summary: Read the current online-editable configuration without secrets
      responses:
        "200":
          description: Current editable Runtime configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditableConfiguration" }
    post:
      operationId: updateRuntimeConfiguration
      summary: Validate, persist and apply one allowlisted Runtime property transactionally
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationUpdateRequest" }
      responses:
        "200":
          description: Configuration validated, persisted and applied
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ConfigurationUpdateResponse" }
                  - { $ref: "#/components/schemas/IdempotentReplayResponse" }
        "400": { description: Invalid request or configuration value; nothing persisted }
        "403": { description: Principal lacks configuration.manage, or property is not online-editable }
        "404": { description: Property is not present in the persistent Runtime file }
        "409":
          description: Apply failed after persistence and the transaction attempted rollback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationUpdateFailure" }
        "401": { description: Missing or invalid management Bearer token }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery }
  /api/v1/management-audit:
    get:
      operationId: listManagementAudit
      summary: Query recent persisted management operation audit events
      security: [{ ManagementBearer: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { in: query, name: operation, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [succeeded, denied, failed, replayed] } }
        - { in: query, name: principal, schema: { type: string } }
      responses:
        "200":
          description: Newest matching audit events first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementAuditInventory" }
        "400": { description: Invalid filter }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks audit.read }
  /api/v1/identity:
    get:
      operationId: getManagementIdentitySnapshot
      summary: Read the active management-identity generation without exposing identities or tokens
      security: [{ ManagementBearer: [] }]
      responses:
        "200":
          description: Active identity snapshot metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentitySnapshot" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks identity.manage }
    post:
      operationId: reloadManagementIdentitySnapshot
      summary: Atomically reload file-backed management tokens from the active configuration
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      responses:
        "200":
          description: Candidate snapshot validated and atomically activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityReloadResponse" }
        "400": { description: Candidate secret source is invalid; the previous generation remains active }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks identity.manage }
        "409": { description: Request ID is already in progress or was reused }
        "428": { description: Management request ID is required by Runtime policy }
  /api/v1/management-tasks:
    get:
      operationId: listManagementTasks
      summary: List retained asynchronous management tasks
      security: [{ ManagementBearer: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { in: query, name: state, schema: { $ref: "#/components/schemas/ManagementTaskState" } }
        - { in: query, name: operation, schema: { type: string } }
      responses:
        "200":
          description: Newest retained tasks first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTaskInventory" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks task.read }
    post:
      operationId: cancelManagementTask
      summary: Cancel a task that is still queued
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagementTaskCancelRequest" }
      responses:
        "200": { description: Queued task cancelled }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks task.cancel }
        "404": { description: Task not found }
        "409": { description: Running or terminal task cannot be cancelled }
        "428": { description: Management request ID is required by Runtime policy }
        "503": { description: Idempotency ledger requires operator recovery }
  /api/v1/management-tasks/{taskId}:
    get:
      operationId: getManagementTask
      summary: Get one retained asynchronous management task
      security: [{ ManagementBearer: [] }]
      parameters:
        - { in: path, name: taskId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Task state and result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementTask" }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks task.read }
        "404": { description: Task not found }
  /api/v1/heartbeat-businesses:
    get:
      responses: { "200": { description: Heartbeat business records } }
  /api/v1/business-traces:
    get:
      responses: { "200": { description: Recent business traces } }
  /api/v1/business-trace-history:
    get:
      responses: { "200": { description: Persisted business trace history } }
  /api/v1/capabilities:
    get:
      operationId: getCapabilityStatus
      summary: Return authoritative policy, persistence and Decision Lease status
      security: [{ ManagementBearer: [] }]
      responses:
        "200":
          description: Capability governance status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityStatus" }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks capability.read or capability.manage }
        "503": { description: Identity or capability Runtime service is unavailable }
  /api/v1/capabilities/audit:
    get:
      operationId: listCapabilityAudit
      summary: Return durable capability authorization audit records
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Durable capability audit records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityAudit" }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks capability.read or capability.manage }
  /api/v1/capabilities/validate:
    post:
      operationId: validateCapabilityPolicy
      summary: Validate and digest a complete default-deny policy without applying it
      security: [{ ManagementBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityPolicyDocument" }
      responses:
        "200": { description: Policy is structurally and semantically valid }
        "400": { description: Policy is invalid }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks capability.manage }
        "413": { description: Request exceeds 1 MiB }
        "429": { description: Per-principal management rate limit exceeded }
  /api/v1/capabilities/policy:
    post:
      operationId: replaceCapabilityPolicy
      summary: Atomically replace the authoritative policy using the authenticated Principal as actor
      description: The request must not contain actor; actor is derived exclusively from the validated Bearer token. The current policy must also authorize that Principal for service:use on pdr.service.capabilityRuntime.
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/CapabilityRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityPolicyReplaceRequest" }
      responses:
        "200":
          description: Policy committed, or an identical request replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityPolicyReplaceResult" }
        "400": { description: Invalid request, supplied actor, or invalid policy }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Principal lacks capability.manage or current capability policy denies service:use }
        "409": { description: Generation conflict or request ID reused with different input }
        "413": { description: Request exceeds 1 MiB }
        "429": { description: Per-principal management rate limit exceeded }
        "503": { description: Persistence failed closed or Runtime service is unavailable }
  /api/v1/resource-governance:
    get:
      operationId: getResourceGovernanceStatus
      summary: Return per-Bundle or module workload isolation, backpressure and circuit status
      description: Execution deadlines use cooperative cancellation and never claim hard C++ thread termination.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: owner
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" }
      responses:
        "200":
          description: Runtime-process Bundle owner lane status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceGovernanceStatus" }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks resource.read }
        "503": { description: Identity or ResourceGovernor service is unavailable }
  /api/v1/scheduled-tasks:
    get:
      operationId: getScheduledTasks
      summary: Return Runtime-managed periodic task schedules and execution counters
      description: One central timer triggers tasks; business callbacks execute through ResourceGovernor owner lanes. The endpoint is read-only.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: taskId
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Managed periodic task status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledTaskStatus" }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks resource.read }
        "503": { description: Identity or Scheduler service is unavailable }
  /api/v1/configuration-transactions:
    get:
      operationId: getConfigurationTransactions
      summary: Return the active transactional configuration generation, participants and history
      description: Values are intentionally omitted so management responses cannot disclose Runtime secrets.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: historyLimit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Transactional configuration status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationTransactionStatus" }
        "400": { description: Invalid historyLimit }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks configuration.manage }
        "503": { description: Identity or ConfigurationRuntime service is unavailable }
    post:
      operationId: applyConfigurationTransaction
      summary: Atomically validate and apply a bounded configuration patch
      description: The server merges string changes into its current snapshot; participant preflight, ordered commit, activation and reverse rollback remain one idempotent transaction.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: header
          name: X-PDR-Request-Id
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationTransactionApplyRequest" }
      responses:
        "200":
          description: Transaction committed or an identical request was replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationTransactionApplyResult" }
        "400": { description: Invalid patch, generation conflict, validator rejection, or request ID reuse with different input }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Principal lacks configuration.manage or configuration:write capability for a changed key }
        "409":
          description: Participant commit failed and the transaction rolled back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationTransactionApplyResult" }
        "413": { description: Request exceeds 1 MiB }
        "422":
          description: A configuration participant rejected preflight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationTransactionApplyResult" }
        "503": { description: Rollback failed, recovery is pending, or the Runtime service is unavailable }
  /api/v1/configuration-transactions/preflight:
    post:
      operationId: preflightConfigurationTransaction
      summary: Preview a bounded configuration patch without changing Runtime state
      description: The Runtime runs the same generation, full-snapshot validation, capability, ownership, participant ordering and participant preflight checks used by apply. It does not write transaction history, activate Preferences, or call participant commit/rollback. A later apply always repeats every check against current generation and participant topology.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: header
          name: X-PDR-Request-Id
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationTransactionApplyRequest" }
      responses:
        "200":
          description: The patch is currently accepted, including an explicit no-change result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationTransactionPreflightResult" }
        "400": { description: Invalid patch or full-snapshot validator rejection }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Principal lacks configuration.manage or configuration:write capability for a changed key }
        "409":
          description: expectedGeneration is stale; no participant preflight was invoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationTransactionPreflightResult" }
        "413": { description: Request exceeds 1 MiB }
        "422":
          description: A configuration participant rejected the side-effect-free preflight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationTransactionPreflightResult" }
        "503": { description: Identity, ConfigurationRuntime or preflight service is unavailable }
  /api/v1/configuration-participants:
    get:
      operationId: getConfigurationParticipants
      summary: Return the current transactional configuration ownership, dependency and admission status
      description: The point-in-time catalog is sorted by participant ID and exposes owned key prefixes, ordering dependencies, registration generations, sanitized registration failures, Bundle-local expected participant contracts, and Bundle-owned configuration key deprecation/removal lifecycles. It contains no configuration values or exception text. Catalog generation advances on every successful attach or detach; admissionGeneration, expectationGeneration and keyLifecycleGeneration advance only when their respective states change. Digest binds the admitted topology. Active Bundle declarations must exactly match admitted ownership; invalid or cross-owner key lifecycles degrade readiness while inactive Bundle declarations remain diagnostic only.
      security: [{ ManagementBearer: [] }]
      responses:
        "200":
          description: Runtime-process configuration participant catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationParticipantCatalogStatus" }
        "400": { description: Query parameters are not supported }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks configuration.manage }
        "503": { description: Identity or configuration participant catalog service is unavailable }
  /api/v1/service-dependencies:
    get:
      operationId: getServiceDependencies
      summary: Return discovered Bundle Service contracts and evaluated dependency readiness
      description: Bundle ownership is inferred from the resource containing service-contracts.json. Required unsatisfied dependencies propagate to /health/ready; optional gaps remain visible without blocking readiness.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: owner
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        - in: query
          name: contract
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      responses:
        "200":
          description: Runtime-process Bundle Service dependency snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDependencyStatus" }
        "400": { description: Unsupported query filter }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks resource.read }
        "503": { description: Identity or ServiceDependencyRuntime service is unavailable }
  /api/v1/service-dependencies/impact:
    get:
      operationId: analyzeServiceDependencyLifecycleImpact
      summary: Analyze Bundle start or stop dependency impact without changing state
      description: Start analysis evaluates the target Consumer's required and optional contracts. Stop analysis simulates removal of the target Provider and reports active Consumers that would lose a satisfied contract. The same decision model is enforced by BundleLoader through the generic osp.bundleLifecycleGuard extension point.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: action
          required: true
          schema: { type: string, enum: [start, stop] }
        - in: query
          name: target
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      responses:
        "200":
          description: Side-effect-free lifecycle admission decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDependencyLifecycleDecision" }
        "400": { description: Missing, duplicate or unsupported impact query parameter }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks resource.read }
        "503": { description: Identity or ServiceDependencyRuntime service is unavailable }
  /api/v1/service-directory:
    get:
      operationId: getRuntimeServiceDirectory
      summary: Return explicitly advertised cross-Runtime service instances
      description: Ordinary OSP services are not advertised automatically. Optional serviceName filtering is read-only; tags are routing metadata and not authorization claims.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: serviceName
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Runtime-fleet service instance directory snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDirectorySnapshot" }
        "400": { description: Unsupported or duplicate query parameter }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks resource.read }
        "503": { description: Identity or ServiceDirectoryRuntime service is unavailable }
  /api/v1/service-directory/route:
    get:
      operationId: routeRuntimeServiceInstance
      summary: Select one ready service endpoint without invoking it
      description: Selection excludes expired, draining and Membership-ineligible Runtime incarnations. This endpoint does not proxy, retry or authorize the selected business call.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: serviceName
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: policy
          required: false
          schema: { type: string, enum: [round-robin, rendezvous-hash, prefer-local], default: round-robin }
        - in: query
          name: routingKey
          required: false
          schema: { type: string, maxLength: 512 }
        - in: query
          name: localRuntimeId
          required: false
          schema: { type: string, maxLength: 128 }
        - in: query
          name: tags
          required: false
          description: Comma-separated required tags
          schema: { type: string, maxLength: 4159 }
      responses:
        "200":
          description: Selected endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDirectoryRouteResult" }
        "400": { description: Invalid request or rendezvous-hash omitted routingKey }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks resource.read }
        "503": { description: No eligible service instance or Runtime service is unavailable }
  /api/v1/service-client:
    get:
      operationId: getRuntimeServiceClient
      summary: Return governed cross-Runtime invocation Provider and circuit status
      description: This read-only endpoint exposes local Provider ownership, per-instance circuits, invocation counters and the ResourceGovernor owner lane. It does not provide a generic remote invocation proxy.
      security: [{ ManagementBearer: [] }]
      responses:
        "200":
          description: Runtime-process Service Client status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClientStatus" }
        "400": { description: Query parameters are not accepted }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks resource.read }
        "503": { description: Identity or ServiceClientRuntime service is unavailable }
  /api/v1/lifecycle-maintenance:
    get:
      operationId: getLifecycleMaintenance
      summary: Return transactional Bundle drain plans and live drain participants
      description: Reports durable maintenance history and current acceptance/in-flight state. In-progress records loaded after a Runtime restart are exposed as crash-recovery pending until topology recovery succeeds. An optional planId filter has no side effects.
      security: [{ ManagementBearer: [] }]
      parameters:
        - in: query
          name: planId
          required: false
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      responses:
        "200":
          description: Runtime-process lifecycle maintenance snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleMaintenanceStatus" }
        "400": { description: Invalid or duplicate planId filter }
        "401": { description: Missing or invalid management Bearer token when authentication is required }
        "403": { description: Authenticated principal lacks resource.read }
        "503": { description: Identity or LifecycleRuntime service is unavailable }
    post:
      operationId: executeLifecycleMaintenance
      summary: Transactionally drain a Provider, restore a drained plan, or retry persisted crash recovery
      description: Drain first quiesces every affected Consumer, waits for in-flight work, stops Consumers, rechecks dependency impact, and stops the Provider. Any failure attempts reverse-order rollback. Restore starts the Provider before its Consumers. Recover retries a durable drainRecoveryPending or restoreRecoveryPending plan. Plans and request IDs are persisted in SQLite and bound to the complete request across Runtime restarts.
      security: [{ ManagementBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/LifecycleRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleMaintenanceRequest" }
      responses:
        "200":
          description: Drain, restore or recovery completed, or an identical durable request was replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleMaintenanceOperation" }
        "400": { description: Invalid action, target, plan ID, timeout, unknown request field, or durable request ID reuse with different input }
        "401": { description: Missing or invalid management Bearer token }
        "403": { description: Authenticated principal lacks bundle.manage }
        "404": { description: Target Bundle, maintenance plan or required Runtime service was not found }
        "409":
          description: The operation safely rolled back or restore preflight failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleMaintenanceOperation" }
        "413": { description: Request exceeds 64 KiB }
        "428": { description: A valid X-PDR-Request-Id is required }
        "503":
          description: Drain failed before a safe transaction could be established, rollback was incomplete, or persisted crash recovery remains pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleMaintenanceOperation" }
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200": { description: Runtime process is live }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200": { description: Runtime is ready }
        "503": { description: Runtime is degraded or down }
  /health/detail:
    get:
      operationId: getHealthDetail
      responses:
        "200":
          description: Aggregated component health with actionable diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDetail"
components:
  parameters:
    ManagementRequestId:
      in: header
      name: X-PDR-Request-Id
      required: false
      description: Unique management operation ID. Required when pdr.management.idempotency.requireRequestId is true; identical retries return the completed result without executing again.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    CapabilityRequestId:
      in: header
      name: X-PDR-Request-Id
      required: true
      description: Durable idempotency key bound to the authenticated Principal, expected generation and candidate policy digest
      schema:
        type: string
        minLength: 1
        maxLength: 128
    LifecycleRequestId:
      in: header
      name: X-PDR-Request-Id
      required: true
      description: Durable SQLite-backed idempotency key bound to the complete lifecycle-maintenance request across Runtime restarts
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  securitySchemes:
    ManagementBearer:
      type: http
      scheme: bearer
      description: Required for protected management APIs; principals receive explicit protocol.manage, process.manage, bundle.manage, configuration.manage, identity.manage, audit.read, task.read, task.cancel, diagnostics.read, diagnostics.execute, capability.read, capability.manage and resource.read permissions
  schemas:
    LifecycleDrainSnapshot:
      type: object
      additionalProperties: false
      required: [state, accepting, inFlight, generation]
      properties:
        state: { type: string, enum: [accepting, quiescing, quiesced] }
        accepting: { type: boolean }
        inFlight: { type: integer, minimum: 0 }
        generation: { type: integer, minimum: 0 }
    LifecycleDrainParticipant:
      type: object
      additionalProperties: false
      required: [owner, drain]
      properties:
        owner: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        drain: { $ref: "#/components/schemas/LifecycleDrainSnapshot" }
    LifecycleMaintenanceStep:
      type: object
      additionalProperties: false
      required: [phase, target, succeeded, detail]
      properties:
        phase: { type: string, minLength: 1, maxLength: 128 }
        target: { type: string, minLength: 1, maxLength: 128 }
        succeeded: { type: boolean }
        detail: { type: string }
    LifecycleMaintenancePlan:
      type: object
      additionalProperties: false
      required: [id, target, status, desiredState, rollbackComplete, code, detail, consumers, steps, createdMicroseconds, updatedMicroseconds, recoveryAttempts]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        target: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        status: { type: string, enum: [draining, restoring, drainRecoveryPending, restoreRecoveryPending, drained, restored, rolledBack, restoreRolledBack, failed] }
        desiredState: { type: string, enum: [active, stopped, transitioning], description: Effective durable Bundle topology intent represented by this plan }
        rollbackComplete: { type: boolean }
        code: { type: string, minLength: 1, maxLength: 128 }
        detail: { type: string }
        createdMicroseconds: { type: integer, minimum: 1 }
        updatedMicroseconds: { type: integer, minimum: 1 }
        recoveryAttempts: { type: integer, minimum: 0 }
        consumers:
          type: array
          maxItems: 1024
          items: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        steps:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/LifecycleMaintenanceStep" }
    LifecycleMaintenanceStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, planCount, participantCount, plans, participants]
      properties:
        schemaVersion: { type: integer, const: 1 }
        principal: { type: string, minLength: 1 }
        scope: { type: string, const: runtime-process/bundle-lifecycle-maintenance }
        planCount: { type: integer, minimum: 0, maximum: 1024 }
        participantCount: { type: integer, minimum: 0, maximum: 1024 }
        plans:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/LifecycleMaintenancePlan" }
        participants:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/LifecycleDrainParticipant" }
    LifecycleDrainRequest:
      type: object
      additionalProperties: false
      required: [action, target]
      properties:
        action: { type: string, const: drain }
        target: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        timeoutMilliseconds: { type: integer, minimum: 10, maximum: 30000, default: 5000 }
    LifecycleRestoreRequest:
      type: object
      additionalProperties: false
      required: [action, planId]
      properties:
        action: { type: string, const: restore }
        planId: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    LifecycleRecoveryRequest:
      type: object
      additionalProperties: false
      required: [action, planId]
      properties:
        action: { type: string, const: recover }
        planId: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    LifecycleMaintenanceRequest:
      oneOf:
        - { $ref: "#/components/schemas/LifecycleDrainRequest" }
        - { $ref: "#/components/schemas/LifecycleRestoreRequest" }
        - { $ref: "#/components/schemas/LifecycleRecoveryRequest" }
      discriminator:
        propertyName: action
    LifecycleMaintenanceOperation:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, succeeded, idempotentReplay, requestId, plan]
      properties:
        schemaVersion: { type: integer, const: 1 }
        principal: { type: string, minLength: 1 }
        scope: { type: string, const: runtime-process/bundle-lifecycle-maintenance }
        succeeded: { type: boolean }
        idempotentReplay: { type: boolean }
        requestId: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        plan: { $ref: "#/components/schemas/LifecycleMaintenancePlan" }
    ServiceContractProvider:
      type: object
      additionalProperties: false
      required: [contract, version, owner, serviceName, state, detail]
      properties:
        contract: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        owner: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        serviceName: { type: string, pattern: "^[A-Za-z0-9._:-]{1,192}$" }
        state: { type: string, enum: [ready, degraded, unavailable] }
        detail: { type: string, maxLength: 512 }
    ServiceContractRequirement:
      type: object
      additionalProperties: false
      required: [contract, versionRange, owner, required, consumerActive, minimumProviders, status, declaredProviders, matchingProviders, readyProviders, detail, matchedProviderServices, availableVersions]
      properties:
        contract: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        versionRange: { type: string, minLength: 1, maxLength: 128 }
        owner: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        required: { type: boolean }
        consumerActive:
          type: boolean
          description: Runtime-derived Bundle activity; inactive Consumers remain available for start admission but do not degrade process readiness
        minimumProviders: { type: integer, minimum: 1, maximum: 64 }
        status: { type: string, enum: [satisfied, missing, versionMismatch, providerDegraded, providerUnavailable] }
        declaredProviders: { type: integer, minimum: 0 }
        matchingProviders: { type: integer, minimum: 0 }
        readyProviders: { type: integer, minimum: 0 }
        detail: { type: string }
        matchedProviderServices:
          type: array
          maxItems: 1024
          items: { type: string, minLength: 1 }
        availableVersions:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
    ServiceContractIssue:
      type: object
      additionalProperties: false
      required: [owner, detail]
      properties:
        owner: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        detail: { type: string, minLength: 1, maxLength: 1024 }
    ServiceDependencyStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, generation, ready, requiredBlocked, optionalUnsatisfied, declarationErrors, activeRequirements, inactiveRequirements, providerCount, requirementCount, providers, requirements, issues, filters]
      properties:
        schemaVersion: { type: integer, const: 1 }
        principal: { type: string, minLength: 1 }
        scope: { type: string, const: runtime-process/bundle-service-contracts }
        generation: { type: integer, minimum: 1 }
        ready: { type: boolean }
        requiredBlocked: { type: integer, minimum: 0, maximum: 1024 }
        optionalUnsatisfied: { type: integer, minimum: 0, maximum: 1024 }
        declarationErrors: { type: integer, minimum: 0, maximum: 1024 }
        activeRequirements: { type: integer, minimum: 0, maximum: 1024 }
        inactiveRequirements: { type: integer, minimum: 0, maximum: 1024 }
        providerCount: { type: integer, minimum: 0, maximum: 1024 }
        requirementCount: { type: integer, minimum: 0, maximum: 1024 }
        providers:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ServiceContractProvider" }
        requirements:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ServiceContractRequirement" }
        issues:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ServiceContractIssue" }
        filters:
          type: object
          additionalProperties: false
          properties:
            owner: { type: string }
            contract: { type: string }
    ServiceDependencyLifecycleFinding:
      type: object
      additionalProperties: false
      required: [code, consumer, contract, status, detail]
      properties:
        code:
          type: string
          enum: [DEPENDENCY_DECLARATION_INVALID, DEPENDENCY_REQUIRED_UNSATISFIED, OPTIONAL_DEPENDENCY_UNSATISFIED, ACTIVE_CONSUMER_DEPENDENCY_IMPACT, OPTIONAL_CONSUMER_DEPENDENCY_IMPACT]
        consumer: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        contract: { type: string, maxLength: 128 }
        status: { type: string, enum: [satisfied, missing, versionMismatch, providerDegraded, providerUnavailable] }
        detail: { type: string, minLength: 1 }
    ServiceDependencyLifecycleDecision:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, action, target, allowed, detail, blockerCount, blockers, warningCount, warnings, affectedConsumers]
      properties:
        schemaVersion: { type: integer, const: 1 }
        principal: { type: string, minLength: 1 }
        scope: { type: string, const: runtime-process/bundle-service-contracts }
        action: { type: string, enum: [start, stop] }
        target: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        allowed: { type: boolean }
        detail: { type: string, minLength: 1 }
        blockerCount: { type: integer, minimum: 0, maximum: 1024 }
        blockers:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ServiceDependencyLifecycleFinding" }
        warningCount: { type: integer, minimum: 0, maximum: 1024 }
        warnings:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ServiceDependencyLifecycleFinding" }
        affectedConsumers:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    ServiceDirectoryInstance:
      type: object
      additionalProperties: false
      required: [serviceName, instanceId, runtimeId, runtimeIncarnation, revision, endpoint, protocol, zone, tags, state, ageMilliseconds]
      properties:
        serviceName: { type: string, minLength: 1, maxLength: 128 }
        instanceId: { type: string, minLength: 1, maxLength: 128 }
        runtimeId: { type: string, minLength: 1, maxLength: 128 }
        runtimeIncarnation: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        endpoint: { type: string, minLength: 1, maxLength: 512 }
        protocol: { type: string, minLength: 1, maxLength: 64 }
        zone: { type: string, maxLength: 64 }
        tags:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        state: { type: string, enum: [ready, draining, expired] }
        ageMilliseconds: { type: integer, minimum: 0 }
    ServiceDirectorySnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, generation, serviceCount, ready, draining, expired, instanceCount, instances]
      properties:
        schemaVersion: { type: integer, const: 1 }
        principal: { type: string, minLength: 1 }
        scope: { type: string, const: runtime-fleet/service-instance-directory }
        generation: { type: integer, minimum: 0 }
        serviceCount: { type: integer, minimum: 0 }
        ready: { type: integer, minimum: 0 }
        draining: { type: integer, minimum: 0 }
        expired: { type: integer, minimum: 0 }
        instanceCount: { type: integer, minimum: 0 }
        instances:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/ServiceDirectoryInstance" }
    ServiceDirectoryRouteResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, status, policy, candidates, detail, instance]
      properties:
        schemaVersion: { type: integer, const: 1 }
        principal: { type: string, minLength: 1 }
        scope: { type: string, const: runtime-fleet/service-instance-routing }
        status: { type: string, const: selected }
        policy: { type: string, enum: [round-robin, rendezvous-hash, prefer-local] }
        candidates: { type: integer, minimum: 1 }
        detail: { type: string }
        instance: { $ref: "#/components/schemas/ServiceDirectoryInstance" }
    ServiceClientProvider:
      type: object
      additionalProperties: false
      required: [providerId, protocol, accepting, active, dispatched, failed]
      properties:
        providerId: { type: string, pattern: "^[!-~]{1,128}$" }
        protocol: { type: string, pattern: "^[!-~]{1,32}$" }
        accepting: { type: boolean }
        active: { type: integer, minimum: 0 }
        dispatched: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    ServiceClientInstanceCircuit:
      type: object
      additionalProperties: false
      required: [serviceName, instanceId, runtimeId, runtimeIncarnation, state, consecutiveFailures, probeInFlight]
      properties:
        serviceName: { type: string, minLength: 1, maxLength: 128 }
        instanceId: { type: string, minLength: 1, maxLength: 128 }
        runtimeId: { type: string, minLength: 1, maxLength: 128 }
        runtimeIncarnation: { type: integer, minimum: 1 }
        state: { type: string, enum: [closed, open, half-open] }
        consecutiveFailures: { type: integer, minimum: 0 }
        probeInFlight: { type: boolean }
    ServiceClientStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, remoteInvocation, durableDelivery, idempotencyEnabled, idempotencyDurable, idempotencyHealthy, idempotencyBackend, idempotencyMaximumEntries, idempotencyEntries, idempotencyInFlight, idempotencyCompleted, idempotencyClaims, idempotencyReplays, idempotencyJoined, idempotencyConflicts, idempotencyIndeterminate, idempotencyRecovered, idempotencyCapacityRejected, idempotencyJournalErrors, idempotencyCoordinatorErrors, providerGeneration, providerCount, maximumProviders, providers, calls, succeeded, failed, attempts, retries, noRoute, circuitRejected, deadlineExceeded, cancelled, instanceCircuitCount, instanceCircuits, resourceOwner, resourceCircuit, resourceActive, resourcePending, maximumPayloadBytes, maximumMetadataEntries, maximumMetadataBytes]
      properties:
        schemaVersion: { type: integer, const: 1 }
        principal: { type: string, minLength: 1 }
        scope: { type: string, const: runtime-process/service-client }
        remoteInvocation: { type: string, const: provider-required }
        durableDelivery: { type: boolean, const: false }
        idempotencyEnabled: { type: boolean }
        idempotencyDurable: { type: boolean }
        idempotencyHealthy: { type: boolean }
        idempotencyBackend: { type: string, minLength: 1, maxLength: 64 }
        idempotencyMaximumEntries: { type: integer, minimum: 0, maximum: 100000 }
        idempotencyEntries: { type: integer, minimum: 0, maximum: 100000 }
        idempotencyInFlight: { type: integer, minimum: 0, maximum: 100000 }
        idempotencyCompleted: { type: integer, minimum: 0, maximum: 100000 }
        idempotencyClaims: { type: integer, minimum: 0 }
        idempotencyReplays: { type: integer, minimum: 0 }
        idempotencyJoined: { type: integer, minimum: 0 }
        idempotencyConflicts: { type: integer, minimum: 0 }
        idempotencyIndeterminate: { type: integer, minimum: 0 }
        idempotencyRecovered: { type: integer, minimum: 0 }
        idempotencyCapacityRejected: { type: integer, minimum: 0 }
        idempotencyJournalErrors: { type: integer, minimum: 0 }
        idempotencyCoordinatorErrors: { type: integer, minimum: 0 }
        providerGeneration: { type: integer, minimum: 0 }
        providerCount: { type: integer, minimum: 0, maximum: 4096 }
        maximumProviders: { type: integer, minimum: 1, maximum: 4096 }
        providers:
