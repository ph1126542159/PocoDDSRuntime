        keyLifecycleEntryCount: { type: integer, minimum: 0, maximum: 1024 }
        keyLifecycles:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/ConfigurationKeyLifecycleEntry" }
        keyLifecycleIssueCount: { type: integer, minimum: 0 }
        keyLifecycleIssues:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationKeyLifecycleIssue" }
