        calls: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        attempts: { type: integer, minimum: 0 }
        retries: { type: integer, minimum: 0 }
        noRoute: { type: integer, minimum: 0 }
        circuitRejected: { type: integer, minimum: 0 }
        deadlineExceeded: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        instanceCircuitCount: { type: integer, minimum: 0, maximum: 100000 }
        instanceCircuits:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/ServiceClientInstanceCircuit" }
        resourceOwner: { type: string, minLength: 1, maxLength: 128 }
        resourceCircuit: { type: string, enum: [closed, open, half-open] }
        resourceActive: { type: integer, minimum: 0 }
        resourcePending: { type: integer, minimum: 0 }
        maximumPayloadBytes: { type: integer, minimum: 1, maximum: 16777216 }
        maximumMetadataEntries: { type: integer, minimum: 0, maximum: 256 }
        maximumMetadataBytes: { type: integer, minimum: 1, maximum: 1048576 }
    ResourceGovernanceLane:
      type: object
      additionalProperties: false
      required: [owner, maximumConcurrency, queueCapacity, queueTimeoutMilliseconds, executionTimeoutMilliseconds, failureThreshold, circuitResetMilliseconds, circuit, stopping, active, pending, consecutiveFailures, submitted, accepted, rejectedQueueFull, rejectedCircuitOpen, queueTimedOut, executionTimedOut, succeeded, failed, cancelled]
      properties:
        owner: { type: string, minLength: 1, maxLength: 128 }
        maximumConcurrency: { type: integer, minimum: 1, maximum: 64 }
        queueCapacity: { type: integer, minimum: 1, maximum: 100000 }
        queueTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000 }
        executionTimeoutMilliseconds: { type: integer, minimum: 1, maximum: 3600000 }
        failureThreshold: { type: integer, minimum: 1, maximum: 100000 }
        circuitResetMilliseconds: { type: integer, minimum: 1, maximum: 3600000 }
        circuit: { type: string, enum: [closed, open, half-open] }
        stopping: { type: boolean }
        active: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        consecutiveFailures: { type: integer, minimum: 0 }
        submitted: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        rejectedQueueFull: { type: integer, minimum: 0 }
        rejectedCircuitOpen: { type: integer, minimum: 0 }
        queueTimedOut: { type: integer, minimum: 0 }
        executionTimedOut: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    ResourceGovernanceStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, cooperativeExecutionTimeout, hardThreadTermination, totalActive, totalPending, laneCount, lanes]
      properties:
        schemaVersion: { type: integer, const: 1 }
        principal: { type: string }
        scope: { type: string, const: runtime-process/bundle-owner-lanes }
        cooperativeExecutionTimeout: { type: boolean, const: true }
        hardThreadTermination: { type: boolean, const: false }
        totalActive: { type: integer, minimum: 0 }
        totalPending: { type: integer, minimum: 0 }
        laneCount: { type: integer, minimum: 0 }
        lanes:
          type: array
          items: { $ref: "#/components/schemas/ResourceGovernanceLane" }
    ScheduledTask:
      type: object
      additionalProperties: false
      required: [id, owner, enabled, mode, misfirePolicy, initialDelayMilliseconds, intervalMilliseconds, jitterMilliseconds, rejectionBackoffMilliseconds, inFlight, coalesced, nextRunInMilliseconds, triggered, accepted, rejected, misfires, completed, failed, lastStatus, lastMessage]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        owner: { type: string, minLength: 1, maxLength: 128 }
        enabled: { type: boolean }
        mode: { type: string, enum: [fixed-delay, fixed-rate] }
