        owner: { type: string, minLength: 1, maxLength: 192 }
        ownerActive: { type: boolean }
        id: { type: string, pattern: "^PDR-CFG-[0-9]{4,}$" }
        participantId: { type: string, pattern: "^[a-z][a-z0-9.-]{0,127}$" }
        operation: { type: string, enum: [rename, remove] }
        sourceKey: { type: string, minLength: 1, maxLength: 192 }
        replacementKey:
          oneOf:
            - { type: string, minLength: 1, maxLength: 192 }
            - { type: "null" }
        deprecatedSince: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        removalAllowedFrom: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        status: { type: string, enum: [inactive, mismatched, published] }
        code: { type: string, enum: ["", configuration-key-lifecycle-owner-mismatch] }
    ConfigurationKeyLifecycleIssue:
      type: object
      additionalProperties: false
      required: [owner, code, blocking]
      properties:
        owner: { type: string, minLength: 1, maxLength: 192 }
        code:
          type: string
          enum: [configuration-key-lifecycle-invalid, configuration-key-lifecycle-cycle]
        blocking: { type: boolean }
    ConfigurationParticipantCatalogStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, scope, generation, digest, participantCount, participants, admissionGeneration, rejectedCount, admissionOverflow, rejectedParticipants, expectationGeneration, expectationsReady, declaredParticipantCount, declaredParticipants, declarationIssueCount, declarationIssues, keyLifecycleGeneration, keyLifecyclesReady, keyLifecycleDeclarationCount, keyLifecycleEntryCount, keyLifecycles, keyLifecycleIssueCount, keyLifecycleIssues]
      properties:
        schemaVersion: { type: integer, const: 4 }
        principal: { type: string }
        scope: { type: string, const: runtime-process/transactional-configuration-participants }
